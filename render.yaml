# Blueprint Render: backend Laravel + database SQLite (plan free, TANPA kartu kredit).
# Cara pakai: Render -> New -> Blueprint -> pilih repo ini.
# Setelah dibuat, isi di dashboard service "laudry-api" (env sync:false):
#   APP_KEY   -> hasil "php artisan key:generate --show" (format base64:....)
#   APP_URL   -> URL backend Render, mis. https://laudry-api.onrender.com
#   FRONTEND_URL -> URL frontend Vercel, mis. https://laundry-kamu.vercel.app
#
# Catatan: database SQLite disimpan sebagai file. Pada plan gratis, file bisa
# ter-reset setiap kali deploy ulang. Cocok untuk demo/portofolio.

services:
  - type: web
    name: laudry-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "Kasir Laundry"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_TIMEZONE
        value: Asia/Jakarta
      - key: LOG_LEVEL
        value: info
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      # Database SQLite (file). Tidak butuh database terpisah / kartu kredit.
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /app/database/database.sqlite
